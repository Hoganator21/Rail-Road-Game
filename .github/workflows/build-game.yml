name: Build Switch Challenge apps

on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - "tools/make_pack_presets.py"
      - ".github/workflows/build-game.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot export templates and Android settings
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          cp -r /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          ls ~/.config/godot

      - name: Stamp version number
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" godot/export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"1.0.${{ github.run_number }}\"/" godot/export_presets.cfg

      - name: Import project
        run: |
          cd godot
          timeout 300 godot --headless --editor --quit || true

      - name: Export Windows
        run: |
          mkdir -p build/windows build/android
          cd godot
          godot --headless --export-release "Windows Desktop" ../build/windows/SwitchChallenge.exe
          test -f ../build/windows/SwitchChallenge.exe

      - name: Export Android
        run: |
          cd godot
          godot --headless --export-debug "Android" ../build/android/SwitchChallenge.apk
          test -f ../build/android/SwitchChallenge.apk

      - name: Export content packs (only when this pack version is not published yet)
        run: |
          command -v python3 >/dev/null && command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq python3 curl)
          V=$(grep -oP 'PACK_VERSION := \K[0-9]+' godot/scripts/packs.gd)
          URL=https://github.com/${{ github.repository }}/releases/download/content-packs
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -L -I $URL/sd70ace_windows_v$V.pck || true)
          mkdir -p build/packs
          if [ "$CODE" = "200" ]; then echo "packs v$V already published"; exit 0; fi
          python3 tools/make_pack_presets.py godot/export_presets.cfg
          cd godot
          for P in sd70ace es44ac gp38; do
            for PL in windows android; do
              godot --headless --export-pack "Pack $P $PL" ../build/packs/${P}_${PL}_v$V.pck
              test -f ../build/packs/${P}_${PL}_v$V.pck
            done
          done
          ls -la ../build/packs

      - name: Publish content packs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: content-packs
          name: Content packs (HD cabs, scenery)
          make_latest: false
          body: Downloadable content for Switch Challenge. The game downloads these itself.
          files: build/packs/*.pck
          fail_on_unmatched_files: false

      - name: Show build sizes
        run: ls -la build/windows build/android

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: game-build-${{ github.run_number }}
          name: Switch Challenge build ${{ github.run_number }}
          make_latest: true
          body: |
            **Android:** download `SwitchChallenge.apk` on your phone and open it to install (allow "install unknown apps" if asked).
            **Windows PC:** download `SwitchChallenge.exe` and run it (click "More info" then "Run anyway" if Windows warns you).
          files: |
            build/android/SwitchChallenge.apk
            build/windows/SwitchChallenge.exe
